apiVersion: v1
kind: ServiceAccount
metadata:
  name: mmc-vehicle-classification-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/REPLACE_WITH_APPROVED_ROLE
---
apiVersion: v1
kind: Service
metadata:
  name: mmc-vehicle-classification
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mmc-vehicle-classification
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmc-vehicle-classification
  namespace: default
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mmc-vehicle-classification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mmc-vehicle-classification
    spec:
      serviceAccountName: mmc-vehicle-classification-sa
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: inference
          image: example.invalid/icu-solarcam/mmc-vehicle-classification@sha256:14b2da6d10f4d53d25f119e7ea81012243f5b00b492803ec9b3d5c8c50554ad7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-2
            - name: FOOTAGE_BUCKET
              value: REPLACE_WITH_BUCKET
            - name: OUTPUT_BUCKET
              value: REPLACE_WITH_BUCKET
            - name: YOLO_CONFIG_DIR
              value: /tmp
            - name: FAISS_BUCKET
              value: REPLACE_WITH_BUCKET
            - name: FAISS_S3_PREFIX
              value: models/mmc-vehicle-classification/faiss_db/v1
            - name: FAISS_LOCAL_DIRECTORY
              value: /tmp/mmc-vector-db
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 12Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "3"
              memory: 12Gi
              ephemeral-storage: "20Gi"
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
