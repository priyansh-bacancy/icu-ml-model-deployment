apiVersion: v1
kind: ServiceAccount
metadata:
  name: restricted-zone-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/REPLACE_WITH_APPROVED_ROLE
---
apiVersion: v1
kind: Service
metadata:
  name: restricted-zone
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: restricted-zone
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restricted-zone
  namespace: default
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: restricted-zone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restricted-zone
    spec:
      serviceAccountName: restricted-zone-sa
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: inference
          image: example.invalid/icu-solarcam/restricted-zone@sha256:9b57cb16b7dbacee9af9e74972cdec5b512adf044fd7521b673325fe63fb5800
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-2
            - name: FOOTAGE_BUCKET
              value: REPLACE_WITH_BUCKET
            - name: OUTPUT_BUCKET
              value: REPLACE_WITH_BUCKET
            - name: YOLO_CONFIG_DIR
              value: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 6Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "3"
              memory: 6Gi
              ephemeral-storage: "20Gi"
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
