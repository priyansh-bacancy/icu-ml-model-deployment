apiVersion: apps/v1
kind: Deployment
metadata:
  name: videomae-aggression
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: videomae-aggression
  template:
    metadata:
      labels:
        app: videomae-aggression
    spec:
      serviceAccountName: videomae-aggression-sa
      nodeSelector:
        eks.amazonaws.com/nodegroup: gpu-nodes-2xlarge
      containers:
        - name: videomae-aggression
          image: 126378326989.dkr.ecr.ap-southeast-2.amazonaws.com/icu-solarcam/videomae-aggression@sha256:952d46e7c6b93cfdb87a3d6676dc36d0c0fab23d10db9b5d01234ac46cc83b52
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: FOOTAGE_BUCKET
              value: "icu-solarcam-storage-bacancy-ap-southeast-2"
            - name: STORAGE_BACKEND
              value: "s3"
            - name: AWS_REGION
              value: "ap-southeast-2"
            - name: DEVICE
              value: "cuda:0"
            - name: MODEL_ID
              value: "videomae-aggression"
            - name: MODEL_VERSION
              value: "v1.0.6"
            - name: MODEL_PATH
              value: "/app/weights/best_model.pt"
            - name: FRAME_CONTEXT_SECONDS
              value: "5.0"
            - name: SCORE_INTERVAL_SECONDS
              value: "1.0"
            - name: BATCH_SIZE
              value: "2"
          resources:
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
